name: 買い方の成績の過去分（作業ブランチ用）

# 2026-11-25：過去の開催日の買い方の成績。1日の予測し直し（check_jra_day.py --saved）に約30分かかり、ml-run で順に回すと
# 6時間の上限に収まらなかったので、日付を分けて同時に回す。各ジョブは、結果ページを取り直して（払戻を入れる）、
# 2025年までのデータだけのモデル一式（data/ml/prev）で予測の入力を作り、data/jra-results と data/ml/day_check/inputs を commit する。
# commit しないファイル（血統の表など）が変わっていると pull --rebase が失敗するので --autostash を付ける（2026-11-25、1回目はこれで何も残らなかった）
# 全部終わったら day_bets.ts --all で data/ml/day_bets を作って commit する。このファイルを変えて push すると起動する
on:
  push:
    branches: [claude/nice-feynman-qgk2q6]
    paths: [.github/workflows/day-bets-backfill.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: day-bets-backfill
  cancel-in-progress: true

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dates:
          - "2026-09-26 2026-09-27"
          - "2026-10-03 2026-10-04"
          - "2026-10-10 2026-10-11"
          - "2026-10-12 2026-10-17"
          - "2026-10-18 2026-10-24"
          - "2026-10-25 2026-10-31"
          - "2026-11-01 2026-11-07"
          - "2026-11-08 2026-11-14"
          - "2026-11-15 2026-11-21"
          - "2026-11-22 2026-11-23"
    steps:
      - uses: actions/checkout@v4
      - run: git pull -q --rebase origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r scripts/ml/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/ml/pedigree_all_features.ts
      - name: Run
        working-directory: scripts/ml
        run: |
          for d in ${{ matrix.dates }}; do
            python check_jra_day.py "$d" --resave || true
            python check_jra_day.py "$d" --saved --inputs-only --model=../../data/ml/prev/model.json || true
          done
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in ${{ matrix.dates }}; do
            for f in "data/jra-results/$d.json" "data/ml/day_check/inputs/$d.json.gz"; do if [ -e "$f" ]; then git add "$f"; fi; done
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "day-bets: inputs ${{ matrix.dates }}"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 15)); done
          git fetch -q origin "${GITHUB_REF_NAME}"; git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "push できなかった"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inputs-${{ strategy.job-index }}
          path: |
            data/jra-results/*.json
            data/ml/day_check/inputs/*.json.gz
          if-no-files-found: ignore

  bets:
    needs: inputs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: git pull -q --rebase origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/ml/day_bets.ts --all
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ml/day_bets
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "day-bets: day_bets.ts --all"
          for i in 1 2 3 4 5 6; do git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 15)); done
          git fetch -q origin "${GITHUB_REF_NAME}"; git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "push できなかった"; exit 1; }
