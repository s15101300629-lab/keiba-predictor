name: JRA PDF parser debug

on:
  push:
    branches:
      - feature/jra-pdf-ingestion-pilot
    paths:
      - .github/workflows/jra-pdf-debug.yml
      - scripts/jra_pdf_probe.py
      - scripts/jra_jockey_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jra-pdf-ingestion-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Probe official JRA jockey name lists
        run: python scripts/jra_jockey_probe.py
      - name: Inspect 2022 official PDF header layout
        run: |
          set +e
          mkdir -p jra-debug
          JRA_PDF_URL="https://www.jra.go.jp/datafile/seiseki/report/2022/2022-1kyoto1.pdf" JRA_OUTPUT_DIR="jra-debug/2022-1kyoto1" JRA_DIAGNOSTICS=1 JRA_EXPECTED_RACES=0 JRA_JOCKEY_NAMES_FILE="jra-pdf-data/jockey-names.json" python scripts/jra_pdf_probe.py >"jra-debug/2022-1kyoto1.log" 2>&1
          echo "parser exit=$?"
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("jra-debug/2022-1kyoto1")
          blocks=json.loads((root/"layout-blocks.json").read_text(encoding="utf-8"))
          lines=json.loads((root/"layout-lines.json").read_text(encoding="utf-8"))
          print("=== BLOCKS CONTAINING RACE WORD ===")
          for b in blocks:
              if "競走" in b["text"] or "2022年" in b["text"]:
                  print(json.dumps(b,ensure_ascii=False))
          print("=== FIRST PAGE TEXT ===")
          txt=(root/"sample-extracted.txt").read_text(encoding="utf-8")
          print(txt[:12000])
          PY
      - name: Upload parser debug materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-pdf-2022-header-debug
          path: |
            jra-debug/
            jra-jockey-probe/
            jra-pdf-data/
          if-no-files-found: error
