name: JRA all-years PDF ingestion

on:
  push:
    branches:
      - feature/jra-pdf-ingestion-pilot
    paths:
      - .github/workflows/jra-pdf-ingest-all.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-all-years:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JRA_WORKERS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jra-pdf-ingestion-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Discover official annual PDF manifest
        run: python scripts/jra_pdf_index.py
      - name: Build official jockey-name dictionary
        run: python scripts/jra_jockey_probe.py
      - name: Parse and validate all official PDFs from 2017 through 2026
        run: |
          set -e
          for year in 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            echo "===== JRA YEAR ${year} ====="
            JRA_YEAR="${year}" JRA_WORKERS="${JRA_WORKERS}" python scripts/jra_pdf_batch.py
          done
      - name: Upload all validated annual datasets and partial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-results-2017-2026
          path: |
            jra-pdf-data/jra-results-*.jsonl.gz
            jra-pdf-data/validation-*.json
            jra-pdf-data/jockey-names.json
          if-no-files-found: warn
      - name: Commit all validated datasets to the feature branch
        if: success()
        run: |
          mkdir -p /tmp/jra-validated-all-years
          cp jra-pdf-data/jra-results-*.jsonl.gz /tmp/jra-validated-all-years/
          cp jra-pdf-data/validation-*.json /tmp/jra-validated-all-years/
          cp jra-pdf-data/jockey-names.json /tmp/jra-validated-all-years/
          git fetch origin feature/jra-pdf-ingestion-pilot
          git reset --hard FETCH_HEAD
          cp /tmp/jra-validated-all-years/* jra-pdf-data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jra-pdf-data/jra-results-*.jsonl.gz jra-pdf-data/validation-*.json jra-pdf-data/jockey-names.json
          git commit -m "Add validated JRA official results datasets for 2017-2026"
          git push origin HEAD:feature/jra-pdf-ingestion-pilot
