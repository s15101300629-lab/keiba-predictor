name: JRA annual PDF ingestion

on:
  push:
    branches:
      - feature/jra-pdf-ingestion-pilot
    paths:
      - scripts/jra_pdf_bulk.py
      - scripts/jra_pdf_probe.py
      - scripts/jra_pdf_index.py
      - .github/workflows/jra-pdf-ingest.yml
  workflow_dispatch:
    inputs:
      year:
        description: "JRA annual PDF year (2017-2026)"
        required: true
        default: "2025"

permissions:
  contents: write

jobs:
  ingest-year:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JRA_YEAR: \${{ github.event.inputs.year || '2025' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jra-pdf-ingestion-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Download and validate every official PDF for the year
        run: python scripts/jra_pdf_bulk.py
      - name: Upload validated annual dataset
        uses: actions/upload-artifact@v4
        with:
          name: jra-results-\${{ env.JRA_YEAR }}
          path: |
            data/jra-results/\${{ env.JRA_YEAR }}.json
            data/jra-results/\${{ env.JRA_YEAR }}.validation.json
          if-no-files-found: error
      - name: Commit validated annual dataset to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/jra-results/\${JRA_YEAR}.json" "data/jra-results/\${JRA_YEAR}.validation.json"
          git commit -m "Add validated JRA official results dataset for \${JRA_YEAR}"
          git push origin HEAD:feature/jra-pdf-ingestion-pilot
