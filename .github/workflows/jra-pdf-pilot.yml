name: JRA PDF extraction pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sample:
    name: inspect-${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: kyoto
            url: https://jra.jp/datafile/seiseki/report/2025/2025-1kyoto1.pdf
          - sample: tokyo
            url: https://jra.jp/datafile/seiseki/report/2025/2025-1tokyo1.pdf
          - sample: tokyo-2017
            url: https://jra.jp/datafile/seiseki/report/2017/2017-1tokyo1.pdf
          - sample: sapporo
            url: https://www.jra.go.jp/datafile/seiseki/report/2025/2025-1sapporo1.pdf
          - sample: chukyo-2026
            url: https://www.jra.go.jp/datafile/seiseki/report/2026/2026-1chukyo1.pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Download and parse official JRA PDF
        env:
          JRA_PDF_URL: ${{ matrix.url }}
        run: python scripts/jra_pdf_probe.py
      - name: Upload parser diagnostics and source PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-pdf-probe-${{ matrix.sample }}
          path: jra-pdf-probe/
          if-no-files-found: error


  discover-pdfs:
    name: discover-official-pdf-index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover annual PDF links from JRA official index
        run: python scripts/jra_pdf_index.py
      - name: Upload official PDF manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-pdf-index-manifest
          path: jra-pdf-index/
          if-no-files-found: error


  bulk-ingest-2026-smoke:
    name: bulk-ingest-2026-official-pdfs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Discover official annual PDF manifest
        run: python scripts/jra_pdf_index.py
      - name: Parse and validate all 2026 JRA PDFs
        env:
          JRA_YEAR: "2026"
          JRA_WORKERS: "8"
        run: python scripts/jra_pdf_batch.py
      - name: Upload annual dataset and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-data-2026-smoke
          path: jra-pdf-data/
          if-no-files-found: error
