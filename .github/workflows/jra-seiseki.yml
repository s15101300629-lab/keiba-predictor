name: JRA 成績表 PDF 変換

on:
  schedule:
    # 土日の開催後（JST 20:17）と月曜（JST 12:17, 祝日開催・差し替え対応）
    - cron: "17 11 * * 0,6"
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      years:
        description: "対象年（スペース区切り。空なら今年）例: 2025 2024"
        required: false
        default: ""
      force:
        description: "変換済みファイルも再変換する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jra-seiseki
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/jra_seiseki/requirements.txt

      - run: pip install -r scripts/jra_seiseki/requirements.txt

      - name: Download and convert
        working-directory: scripts
        env:
          YEARS: ${{ github.event.inputs.years }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ -n "$YEARS" ]; then args+=(--year $YEARS); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -m jra_seiseki update "${args[@]}"

      - name: Commit data
        run: |
          git add data/jra-seiseki
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update JRA seiseki ($(date -u +%Y-%m-%d))"
          git push
