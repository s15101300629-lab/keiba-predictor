name: AI予測モデル学習

on:
  # 成績表の変換後に、最新データで学び直す
  workflow_run:
    workflows: ["JRA 成績表 PDF 変換"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jra-seiseki
  cancel-in-progress: false

jobs:
  train:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r scripts/ml/requirements.txt

      - name: Train LightGBM
        working-directory: scripts/ml
        run: python train.py

      - name: Check Python/TypeScript feature parity
        run: node --experimental-strip-types scripts/ml/parity.ts

      - name: Commit model
        run: |
          git add data/ml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "model: retrain AI prediction ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
