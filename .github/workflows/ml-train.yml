name: AI予測モデル学習

on:
  # 成績表の変換後に、最新データで学び直す
  workflow_run:
    workflows: ["JRA 成績表 PDF 変換"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jra-seiseki
  cancel-in-progress: false

jobs:
  train:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r scripts/ml/requirements.txt requests

      # 調教評価（netkeiba の調教ページ）を、成績表の新しいレースの分だけ取る（取得済みは飛ばす。1ページ5秒間隔）
      - name: Collect training ratings
        working-directory: scripts/ml
        run: python collect_training.py "$(TZ=Asia/Tokyo date +%Y)"

      # クッション値・含水率（JRA の馬場情報のページの直近の分。過去の PDF は data/baba/baba.csv に入っている）
      - name: Collect baba
        run: python scripts/ml/collect_baba_live.py || true

      - run: npm install --no-audit --no-fund

      # 血統（本体モデルの入力）: 新しいレースの出走馬の馬ID・父・母父・母母父と、新しい祖先の産駒成績を取り、全出走馬の血統の特徴量を作り直す
      - name: Collect pedigrees of new runners
        env:
          PEDIGREE_CONCURRENCY: "2"
          PEDIGREE_WAIT_MS: "1000"
        run: npx tsx scripts/ml/collect_all_pedigree.ts --max-minutes 60

      - name: Build pedigree features for all runners
        run: npx tsx scripts/ml/pedigree_all_features.ts

      - name: Train LightGBM
        working-directory: scripts/ml
        run: python train.py

      - name: Check Python/TypeScript feature parity
        run: node --experimental-strip-types scripts/ml/parity.ts

      # 外国馬の扱い：短期免許の外国人騎手の JRA での通算（アプリが読む。2026-11-26）
      - name: Foreign jockeys' JRA career
        working-directory: scripts/ml
        run: python foreign_jockeys.py

      # 2段目（AI確率 + 血統）: 新しい重賞の出走馬の血統を netkeiba から追加取得して学び直す
      - name: Collect pedigrees of graded-race runners
        run: npx tsx scripts/ml/collect_pedigree.ts

      - name: Build pedigree features
        run: npx tsx scripts/ml/pedigree_features.ts

      - name: Train stacking model
        working-directory: scripts/ml
        run: python train_stack.py

      - name: Commit model
        run: |
          git add data/ml data/pedigree data/training data/baba data/overseas
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "model: retrain AI prediction ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash
          git push

      # 本体が変わったら、オッズと合わせる係数・AI印の過去の成績・人気薄専用の2段目（☆）も作り直す（2026-11-22）
      # どれも年ごとに前年までで学習した本体の予測（backtest_value.prepare）を使う。最初の train_longshot.py が 2022年からの予測を作ってためる
      - name: Train longshot model (AI mark ☆)
        working-directory: scripts/ml
        run: python train_longshot.py

      - name: Check Python/TypeScript longshot parity
        run: npx tsx scripts/ml/parity_longshot.ts

      - name: Refit market combination (value labels)
        working-directory: scripts/ml
        run: python backtest_value.py

      - name: Backtest AI marks
        working-directory: scripts/ml
        run: python backtest_marks.py

      - name: Commit market models
        run: |
          git add data/ml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "model: refit market combination, AI marks and longshot model ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash
          git push
