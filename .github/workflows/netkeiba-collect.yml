name: netkeiba 調教評価・備考の取得と検証

# 調教評価（追い切りの短評・A〜D）と、スマホ版レース結果の備考・上がり3F・通過順を取得し、
# 両方そろったら eval_new_info.py で効果（的中率・回収率）を検証する。
# 取得は続きから再開できるので、15分ごとに途中結果を commit する。
on:
  push:
    branches: [claude/horse-racing-pdf-conversion-ucigrq]
    paths: [.github/workflows/netkeiba-collect.yml]
  workflow_dispatch:
    inputs:
      year:
        description: 取得する年
        default: "2026"

permissions:
  contents: write

concurrency:
  group: netkeiba-collect
  cancel-in-progress: false

env:
  YEAR: ${{ github.event.inputs.year || '2026' }}

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: collect_training.py
            dir: data/training
          - script: collect_remarks.py
            dir: data/remarks
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect (resumable, commit every 15 minutes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add "${{ matrix.dir }}"
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "data: ${{ matrix.script }} ${YEAR}（途中結果）"
            for i in 1 2 3 4; do
              git pull -q --rebase && git push -q && return 0
              sleep $((i * 10))
            done
            return 1
          }
          for round in $(seq 1 22); do
            set +e
            (cd scripts/ml && timeout 15m python ${{ matrix.script }} "$YEAR")
            code=$?
            set -e
            save
            if [ "$code" -eq 0 ]; then echo "finished"; exit 0; fi
            if [ "$code" -ne 124 ]; then echo "collector failed ($code)"; exit "$code"; fi
          done

  evaluate:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - run: git pull -q
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt
      - run: pip install -r scripts/ml/requirements.txt
      - name: Evaluate new information
        working-directory: scripts/ml
        run: python eval_new_info.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ml/new_info_eval.json
          git diff --cached --quiet && exit 0
          git commit -m "検証: 調教評価・備考・上がり3F の効果（${YEAR}）"
          git pull --rebase && git push
