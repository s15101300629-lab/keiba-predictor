name: netkeiba 調教評価・備考の取得

# 調教評価（追い切りの短評・A〜D）と、スマホ版レース結果の備考・上がり3F・通過順を取得する。
# 取得は続きから再開できるので、15分ごとに途中結果を commit する。
# netkeiba がメンテナンス中（503）のときは、明けるまで最大5時間待ってから始める。
# 取る年と種類は下の matrix で決める（2026-11-19：2025年の調教評価と、2026年の備考の残り）。
on:
  push:
    branches: [claude/horse-racing-pdf-conversion-ucigrq]
    paths: [.github/workflows/netkeiba-collect.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netkeiba-collect
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: collect_training.py
            dir: data/training
            year: "2025"
          - script: collect_remarks.py
            dir: data/remarks
            year: "2026"
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Wait until netkeiba is available (max 5 hours)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://race.netkeiba.com/race/oikiri.html?race_id=202608050411" || true)
            echo "$(date -u +%H:%M) netkeiba $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 300
          done
          echo "netkeiba is still unavailable"; exit 1
      - name: Collect (resumable, commit every 15 minutes)
        env:
          YEAR: ${{ matrix.year }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add "${{ matrix.dir }}"
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "data: ${{ matrix.script }} ${YEAR}（途中結果）"
            for i in 1 2 3 4; do
              git pull -q --rebase && git push -q && return 0
              sleep $((i * 10))
            done
            return 1
          }
          for round in $(seq 1 22); do
            set +e
            (cd scripts/ml && timeout 15m python ${{ matrix.script }} "$YEAR")
            code=$?
            set -e
            save
            if [ "$code" -eq 0 ]; then echo "finished"; exit 0; fi
            if [ "$code" -ne 124 ]; then echo "collector failed ($code)"; exit "$code"; fi
          done
