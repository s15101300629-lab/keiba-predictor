name: レース前の種牡馬の成績

# 毎日 19:43 JST に、日本時間の今日から4日分の出馬表の出走馬を見て、data/pedigree/stallions.json にない
# （または年替わりで取り直す）父・母父・母母父の産駒成績を netkeiba から取り、main に保存する（2026-11-25、依頼者の指示）。
# アプリは種牡馬の成績をまずこのファイルから読むので、初めて開くレースが速くなる。成績がファイルにそろっている種牡馬は取らない
on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:
    inputs:
      dates:
        description: "日付（YYYYMMDD を空白区切り。空なら今日から4日分）"
        required: false
        default: ""

permissions:
  contents: write

# stallions.json・horses.json は再学習（ml-train.yml）も書くので、同じ組で順に動かす
concurrency:
  group: jra-seiseki
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Collect
        run: npx tsx scripts/ml/collect_upcoming_pedigree.ts ${{ github.event.inputs.dates }} | tee -a "$GITHUB_STEP_SUMMARY"

      # 出走予定の重賞の馬・外国馬のフランスの走の区間タイム（France Galop。アプリは data/overseas/francegalop.json を読む。2026-11-26）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: France Galop sectionals
        working-directory: scripts/ml
        run: pip install -q pypdf==6.17.0 requests && python francegalop.py upcoming || true; pip install -q -r requirements.txt && python wbrr.py || true

      - name: Commit
        run: |
          git add data/pedigree/stallions.json data/pedigree/all/horses.json data/overseas/francegalop.json data/overseas/upcoming_overseas.json data/overseas/wbrr.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: レース前の種牡馬の成績（$(date -d '+9 hours' +%Y-%m-%d)）"
          git pull --rebase --autostash
          git push
