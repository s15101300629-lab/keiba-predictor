name: 依頼者の7項目の比較（作業ブランチ用）

# 2026-11-24：compare_round4.py の比較を、項目ごとに別のジョブで同時に回す（1つのジョブの時間の上限 6時間に収めるため）。
# このファイルか .github/round4.txt を変えて push すると起動する。結果（data/ml/round4_*.json など）を作業ブランチに commit する
on:
  push:
    branches: [claude/nice-feynman-qgk2q6]
    paths: [.github/round4.txt, .github/workflows/round4.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: round4
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        task:
          - "python drift.py build && python compare_round4.py venue"
          - "python compare_round4.py missing"
          - "python compare_round4.py rounds && python compare_round4.py seeds"
          - "TUNE_TIMEOUT=10800 python tune_params.py tune 60 && python compare_round4.py tuned"
          - "python compare_pl.py"
    steps:
      - uses: actions/checkout@v4
      - run: git pull -q --rebase origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r scripts/ml/requirements.txt optuna
      - run: npm ci --no-audit --no-fund
      - name: Build dataset
        run: npx tsx scripts/ml/pedigree_all_features.ts && cd scripts/ml && python cache_dataset.py
      - name: Run
        working-directory: scripts/ml
        run: |
          if [ "${{ matrix.task }}" = "python compare_pl.py" ] && [ ! -f compare_pl.py ]; then echo "compare_pl.py はまだない（設計の確認待ち）"; exit 0; fi
          bash -c "${{ matrix.task }}" < /dev/null
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ml/round4_*.json data/ml/feature_stats.json data/ml/pl_*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "round4: ${{ matrix.task }}"
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 15)); done
